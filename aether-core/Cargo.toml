[package]
name = "aether-core"
version = "0.1.0"
edition = "2021"
authors = ["AetherTG Team"]
description = "High-performance native Rust core engine for AetherTG: Pulse classifier, urgency math, and spring physics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
regex = "1.10"
once_cell = "1.19"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
