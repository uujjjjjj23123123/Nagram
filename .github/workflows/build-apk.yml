name: Build AetherTG APK

on:
  push:
    branches: [ "master", "main", "aether" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main", "aether" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        run: |
          echo "y" | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk

      - name: Install cargo-ndk
        run: which cargo-ndk || cargo install cargo-ndk

      - name: Build Native Rust Core (libaether_core.so)
        run: |
          cd aether-core
          mkdir -p ../TMessagesProj/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../TMessagesProj/src/main/jniLibs build --release
          cd ..
          ls -la TMessagesProj/src/main/jniLibs/

      - name: Ensure gradlew is executable
        run: chmod +x gradlew || true

      - name: Configure Keystore and local.properties
        env:
          APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          keytool -genkey -v -keystore TMessagesProj/release.keystore -alias aether -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AetherTG, OU=Aether, O=Aether, L=Global, S=Global, C=US"
          echo "telegram.app.id=${APP_ID}" > local.properties
          echo "telegram.app.hash=${APP_HASH}" >> local.properties
          echo "KEYSTORE_PASS=android" >> local.properties
          echo "ALIAS_NAME=aether" >> local.properties
          echo "ALIAS_PASS=android" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" >> local.properties

      - name: Build Debug APK
        run: |
          ./gradlew assembleAfatDebug --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Locate and Rename Artifact
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherTG-Android-Build
          path: output_apk/*.apk
          retention-days: 14

      - name: Publish Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/*.apk
          generate_release_notes: true
