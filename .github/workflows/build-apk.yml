name: Build AetherTG APK

on:
  push:
    branches: [ "master", "main", "aether" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main", "aether" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Ensure gradlew is executable
        run: chmod +x gradlew || true

      - name: Configure local.properties
        env:
          APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          echo "telegram.app.id=${APP_ID}" > local.properties
          echo "telegram.app.hash=${APP_HASH}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      - name: Build Debug APK
        run: |
          ./gradlew assembleAfatDebug --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Locate and Rename Artifact
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherTG-Android-Build
          path: output_apk/*.apk
          retention-days: 14

      - name: Publish Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/*.apk
          generate_release_notes: true
